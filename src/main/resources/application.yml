spring:
  application:
    name: nordia-meeting-rooms
  datasource:
    url: jdbc:sqlite:${NORDIA_DB_PATH:nordia.db}?foreign_keys=on&transaction_mode=IMMEDIATE&busy_timeout=5000
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true

nordia:
  booking:
    zone: Europe/Paris
    opening-start: "08:00"
    opening-end: "19:00"
    min-duration: 15m
    max-duration: 4h
    max-active-per-organiser-per-day: 3
  jwt:
    secret: ${NORDIA_JWT_SECRET:}
    expiration: 1h
  security:
    token-blacklist: memory
  demo-users:
    - email: alice@nordia.com
      password: alice123
      display-name: Alice Martin
    - email: bob@nordia.com
      password: bob123
      display-name: Bob Durand
    - email: carol@nordia.com
      password: carol123
      display-name: Carol Petit
